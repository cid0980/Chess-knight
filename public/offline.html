<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17231e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f4f0" media="(prefers-color-scheme: light)">
  <title>Offline · KnightClub</title>
  <style>
    :root{
      color-scheme:light;
      --page:#f3f4f0; --surface:#fff; --ink:#1b2420; --muted:#7f8c84; --line:#e5e9e4;
      --mark-bg:#17382b; --mark-ink:#eff5e6; --button:#286046; --button-hover:#1e5038;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink); background:var(--page);
    }
    @media (prefers-color-scheme: dark){
      :root{ color-scheme:dark; --page:#0e1512; --surface:#161e1a; --ink:#e9f0ea; --muted:#8b9a90; --line:#26312b; }
    }
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:var(--page)}
    main{width:min(100%,390px);padding:30px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 14px 45px rgba(10,20,15,.18);text-align:center}
    .mark{width:52px;height:52px;margin:0 auto 17px;display:grid;place-items:center;border-radius:15px;color:var(--mark-ink);background:var(--mark-bg);font-size:31px}
    h1{margin:0 0 9px;font-size:23px;letter-spacing:-.5px}p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}
    ul{margin:14px 0 0;padding:0;list-style:none;text-align:left;color:var(--muted);font-size:12px;line-height:1.7}
    li::before{content:"♞";margin-right:8px;color:var(--mark-bg)}
    @media (prefers-color-scheme: dark){ li::before{color:#7fc795} }
    button{margin-top:22px;min-height:42px;padding:0 17px;border:0;border-radius:9px;color:#fff;background:var(--button);font:inherit;font-size:13px;font-weight:650;cursor:pointer}
    button:hover{background:var(--button-hover)}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">♞</div>
    <h1>You’re offline</h1>
    <p>KnightClub needs a connection to load the app and to play live games.</p>
    <ul>
      <li>Reconnect, then reload this page.</li>
      <li>Friend requests and challenges are live-only.</li>
      <li>Local practice needs the app shell, so it is available once the page loads.</li>
    </ul>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
