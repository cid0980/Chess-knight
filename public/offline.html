<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17231e">
  <title>Offline · KnightClub</title>
  <style>
    :root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1b2420;background:#f3f4f0}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(100%,390px);padding:30px;border:1px solid #e2e9e2;border-radius:18px;background:#fff;box-shadow:0 14px 45px rgba(25,44,35,.07);text-align:center}
    .mark{width:52px;height:52px;margin:0 auto 17px;display:grid;place-items:center;border-radius:15px;color:#eff5e6;background:#17382b;font-size:31px}
    h1{margin:0 0 9px;font-size:23px;letter-spacing:-.5px}p{margin:0;color:#728076;font-size:13px;line-height:1.65}
    button{margin-top:22px;min-height:42px;padding:0 17px;border:0;border-radius:9px;color:#fff;background:#286046;font:inherit;font-size:13px;font-weight:650;cursor:pointer}
  </style>
</head>
<body><main><div class="mark" aria-hidden="true">♞</div><h1>You’re offline</h1><p>KnightClub needs an internet connection to load. Reconnect, then reload to send friend requests or play online.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
